<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>OPEC Attendance</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 95%;
  max-width: 750px;
  background: white;
  border-radius: 25px;
  padding: 35px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.10);
}

.logo {
  font-size: 42px;
  font-weight: bold;
  color: #172b4d;
}

.title {
  font-size: 22px;
  color: #68758a;
  margin-bottom: 20px;
}

.instruction {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  max-width: 650px;
  margin: auto;
  border-radius: 20px;
  overflow: hidden;
}

.status {
  margin-top: 20px;
  font-size: 18px;
  color: #68758a;
}

.success {
  color: #15803d;
  font-weight: bold;
}

.error {
  color: #dc2626;
  font-weight: bold;
}

.detected {
  margin-top: 20px;
  padding: 15px;
  background: #ecfdf5;
  border-radius: 10px;
  color: #15803d;
  font-weight: bold;
  display: none;
}

.cameraSelect {
  margin-bottom: 15px;
  padding: 10px;
  font-size: 16px;
  border-radius: 8px;
  width: 90%;
  max-width: 500px;
}

</style>

</head>


<body>

<div class="card">

  <div class="logo">
    OPEC
  </div>

  <div class="title">
    Employee Attendance
  </div>

  <div class="instruction">
    PLEASE SCAN YOUR QR CODE
  </div>


  <select id="cameraSelect"
          class="cameraSelect">
  </select>


  <div id="reader"></div>


  <div id="status"
       class="status">

    Starting camera...

  </div>


  <div id="detected"
       class="detected">

    ✓ QR CODE DETECTED

  </div>

</div>


<script>


/* =====================================================
   SETTINGS
   ===================================================== */


/*
 * IMPORTANT:
 *
 * Replace the URL below with your
 * Google Apps Script Web App URL.
 */

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvi8ohV2MzVZY2GWJMveirCREAhDuqyWthqFQ0LbrQo9Cx-h9nursObxBb9GkmQIgy/exec';

/* =====================================================
   VARIABLES
   ===================================================== */

let scanner = null;

let alreadyScanned = false;


/* =====================================================
   GET AVAILABLE CAMERAS
   ===================================================== */

Html5Qrcode.getCameras()

.then(function(cameras) {


  const cameraSelect =
    document.getElementById("cameraSelect");


  /*
   * Check if camera exists
   */

  if (!cameras || cameras.length === 0) {

    document.getElementById(
      "status"
    ).innerHTML =

      "<span class='error'>" +
      "No camera detected." +
      "</span>";

    return;

  }


  /*
   * Show available cameras
   */

  cameras.forEach(function(camera, index) {


    const option =
      document.createElement("option");


    option.value =
      camera.id;


    option.text =
      camera.label ||
      "Camera " + (index + 1);


    cameraSelect.appendChild(option);

  });


  /*
   * Try to find HP camera
   */

  let selectedCamera =
    cameras.find(function(camera) {

      return camera.label
        .toLowerCase()
        .includes("hp");

    });


  /*
   * If HP camera is not found,
   * use the first camera.
   */

  if (!selectedCamera) {

    selectedCamera =
      cameras[0];

  }


  /*
   * Select the camera
   */

  cameraSelect.value =
    selectedCamera.id;


  /*
   * Start scanner
   */

  startScanner(
    selectedCamera.id
  );

})


.catch(function(error) {


  console.error(error);


  document.getElementById(
    "status"
  ).innerHTML =

    "<span class='error'>" +
    "Unable to access camera." +
    "</span>";

});


/* =====================================================
   START SCANNER
   ===================================================== */

function startScanner(cameraId) {


  scanner =
    new Html5Qrcode("reader");


  const config = {


    fps: 20,


    /*
     * Scanning box
     */

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {


      const minSize =
        Math.min(
          viewfinderWidth,
          viewfinderHeight
        );


      return {

        width:
          Math.floor(
            minSize * 0.75
          ),

        height:
          Math.floor(
            minSize * 0.75
          )

      };

    },


    /*
     * QR CODE ONLY
     */

    formatsToSupport: [

      Html5QrcodeSupportedFormats.QR_CODE

    ],


    disableFlip: false

  };


  /*
   * START CAMERA
   */

  scanner.start(


    cameraId,


    config,


    /*
     * =================================================
     * QR CODE SUCCESSFULLY READ
     * =================================================
     */

    function(decodedText, decodedResult) {


      /*
       * Prevent multiple scans
       */

      if (alreadyScanned) {

        return;

      }


      alreadyScanned = true;


      console.log(
        "QR CODE FOUND:",
        decodedText
      );


      /*
       * Update status
       */

      document.getElementById(
        "status"
      ).innerHTML =

        "<span class='success'>" +

        "✓ QR CODE SUCCESSFULLY READ" +

        "</span>";


      /*
       * Show detected message
       */

      document.getElementById(
        "detected"
      ).style.display = "block";


      /*
       * Stop camera
       */

      scanner.stop()


      .then(function() {


        console.log(
          "Scanner stopped."
        );


        /*
         * =================================================
         * SEND QR TO GOOGLE APPS SCRIPT
         * =================================================
         */


        /*
         * Make sure the Apps Script URL
         * has been entered.
         */

       

        /*
         * Create destination URL
         */

        const destination =

          APPS_SCRIPT_URL +

          '?qr=' +

          encodeURIComponent(
            decodedText
          );


        console.log(
          "Sending QR to Apps Script:",
          destination
        );


        /*
         * Open Apps Script result page
         */

        window.location.href =
          destination;


      })


      .catch(function(error) {


        console.log(
          "Scanner stop error:",
          error
        );


      });


    },


    /*
     * =================================================
     * SCANNING ERRORS
     * =================================================
     */

    function(errorMessage) {


      /*
       * Ignore normal scanning errors.
       *
       * The scanner continuously reports
       * errors while searching for a QR.
       */

    }

  )


  /*
   * =================================================
   * CAMERA STARTED
   * =================================================
   */

  .then(function() {


    document.getElementById(
      "status"
    ).innerText =

      "Camera ready — " +

      "place the QR code inside the box.";


  })


  /*
   * =================================================
   * CAMERA ERROR
   * =================================================
   */

  .catch(function(error) {


    console.error(
      "Scanner start error:",
      error
    );


    document.getElementById(
      "status"
    ).innerHTML =

      "<span class='error'>" +

      "Unable to start scanner." +

      "</span>";


  });

}

</script>

</body>

</html>
