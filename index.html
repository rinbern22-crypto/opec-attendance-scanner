<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>OPEC Attendance</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 95%;
  max-width: 750px;
  background: white;
  border-radius: 25px;
  padding: 35px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.10);
}

.logo {
  font-size: 42px;
  font-weight: bold;
  color: #172b4d;
}

.title {
  font-size: 22px;
  color: #68758a;
  margin-bottom: 20px;
}

.instruction {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  max-width: 650px;
  margin: auto;
  border-radius: 20px;
  overflow: hidden;
}

.status {
  margin-top: 20px;
  font-size: 18px;
  color: #68758a;
}

.success {
  color: #15803d;
  font-weight: bold;
}

.error {
  color: #dc2626;
  font-weight: bold;
}

.detected {
  margin-top: 20px;
  padding: 15px;
  background: #ecfdf5;
  border-radius: 10px;
  color: #15803d;
  font-weight: bold;
  display: none;
}

.result {
  margin-top: 15px;
  padding: 15px;
  background: #f0fdf4;
  border: 2px solid #22c55e;
  border-radius: 10px;
  word-break: break-all;
  display: none;
  font-size: 16px;
}

.cameraSelect {
  margin-bottom: 15px;
  padding: 10px;
  font-size: 16px;
  border-radius: 8px;
  width: 90%;
  max-width: 500px;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">
OPEC
</div>

<div class="title">
Employee Attendance
</div>

<div class="instruction">
PLEASE SCAN YOUR QR CODE
</div>

<select id="cameraSelect"
        class="cameraSelect">
</select>

<div id="reader"></div>

<div id="status"
     class="status">

Starting camera...

</div>

<div id="detected"
     class="detected">

✓ QR CODE DETECTED

</div>

<div id="result"
     class="result">

</div>

</div>


<script>

let scanner = null;
let alreadyScanned = false;


/*
 * GET AVAILABLE CAMERAS
 */

Html5Qrcode.getCameras()

.then(function(cameras) {

  const cameraSelect =
    document.getElementById("cameraSelect");

  if (!cameras || cameras.length === 0) {

    document.getElementById("status").innerHTML =
      "<span class='error'>" +
      "No camera detected." +
      "</span>";

    return;
  }


  /*
   * Show all available cameras
   */

  cameras.forEach(function(camera, index) {

    const option =
      document.createElement("option");

    option.value = camera.id;

    option.text =
      camera.label ||
      "Camera " + (index + 1);

    cameraSelect.appendChild(option);

  });


  /*
   * Try to select the HP camera
   */

  let selectedCamera =
    cameras.find(function(camera) {

      return camera.label
        .toLowerCase()
        .includes("hp");

    });


  /*
   * If HP camera is not found,
   * use the first available camera.
   */

  if (!selectedCamera) {

    selectedCamera = cameras[0];

  }


  cameraSelect.value =
    selectedCamera.id;


  startScanner(selectedCamera.id);

})


.catch(function(error) {

  console.error(error);

  document.getElementById("status").innerHTML =
    "<span class='error'>" +
    "Unable to access camera." +
    "</span>";

});


/*
 * START SCANNER
 */

function startScanner(cameraId) {

  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 20,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      const minSize =
        Math.min(
          viewfinderWidth,
          viewfinderHeight
        );

      return {

        width:
          Math.floor(minSize * 0.75),

        height:
          Math.floor(minSize * 0.75)

      };

    },

    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE
    ],

    disableFlip: false

  };


  scanner.start(

    cameraId,

    config,


    /*
     * QR SUCCESS
     */

    function(decodedText, decodedResult) {

      if (alreadyScanned) {
        return;
      }

      alreadyScanned = true;


      console.log(
        "QR CODE FOUND:",
        decodedText
      );


      document.getElementById(
        "status"
      ).innerHTML =

        "<span class='success'>" +
        "✓ QR CODE SUCCESSFULLY READ" +
        "</span>";


      document.getElementById(
        "detected"
      ).style.display = "block";


      /*
       * SHOW THE ACTUAL VALUE
       */

      const result =
        document.getElementById("result");


      result.style.display = "block";


      result.innerHTML =

        "<strong>QR VALUE:</strong><br><br>" +

        decodedText;


      /*
       * STOP CAMERA
       */

      scanner.stop()

      .then(function() {

        console.log(
          "Scanner stopped."
        );

      })

      .catch(function(error) {

        console.log(
          "Scanner stop error:",
          error
        );

      });

    },


    /*
     * SCANNING ERROR
     */

    function(errorMessage) {

      /*
       * Ignore normal scanning errors.
       */

    }

  )

  .then(function() {

    document.getElementById(
      "status"
    ).innerText =

      "Camera ready — " +
      "place the QR code inside the box.";

  })

  .catch(function(error) {

    console.error(
      "Scanner start error:",
      error
    );


    document.getElementById(
      "status"
    ).innerHTML =

      "<span class='error'>" +
      "Unable to start scanner." +
      "</span>";

  });

}

</script>

</body>

</html>
