<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>OPEC Attendance</title>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 95%;
  max-width: 750px;
  background: white;
  border-radius: 25px;
  padding: 35px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.10);
}

.logo {
  font-size: 42px;
  font-weight: bold;
  color: #172b4d;
}

.title {
  font-size: 22px;
  color: #68758a;
  margin-bottom: 20px;
}

.instruction {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  max-width: 650px;
  margin: auto;
  border-radius: 20px;
  overflow: hidden;
}

.status {
  margin-top: 20px;
  font-size: 18px;
  color: #68758a;
}

.success {
  color: #15803d;
  font-weight: bold;
}

.error {
  color: #dc2626;
  font-weight: bold;
}

.warning {
  color: #b45309;
  font-weight: bold;
}

.detected {
  margin-top: 20px;
  padding: 15px;
  background: #ecfdf5;
  border-radius: 10px;
  color: #15803d;
  font-weight: bold;
  display: none;
}

.cameraSelect {
  margin-bottom: 15px;
  padding: 10px;
  font-size: 16px;
  border-radius: 8px;
  width: 90%;
  max-width: 500px;
}

.resultBox {
  display: none;
  margin-top: 20px;
  padding: 30px 20px;
  border-radius: 20px;
}

.resultSuccess {
  background: #ecfdf5;
}

.resultWarning {
  background: #fffbeb;
}

.resultError {
  background: #fef2f2;
}

.resultTitle {
  font-size: 36px;
  font-weight: bold;
  margin-bottom: 15px;
}

.resultEmployee {
  font-size: 27px;
  font-weight: bold;
  margin-bottom: 8px;
}

.resultID {
  color: #68758a;
  font-size: 18px;
  margin-bottom: 15px;
}

.resultTime {
  font-size: 42px;
  font-weight: bold;
  margin: 15px 0;
}

.resultMessage {
  font-size: 20px;
}

.readyMessage {
  margin-top: 15px;
  color: #68758a;
  font-size: 16px;
}

</style>

</head>


<body>

<div class="card">

  <div class="logo">
    OPEC
  </div>

  <div class="title">
    Employee Attendance
  </div>

  <div class="instruction">
    PLEASE SCAN YOUR QR CODE
  </div>


  <select
    id="cameraSelect"
    class="cameraSelect">
  </select>


  <div id="reader"></div>


  <div id="status"
       class="status">

    Starting camera...

  </div>


  <div id="detected"
       class="detected">

    ✓ QR CODE DETECTED

  </div>


  <div id="resultBox"
       class="resultBox">

    <div id="resultTitle"
         class="resultTitle">
    </div>

    <div id="resultEmployee"
         class="resultEmployee">
    </div>

    <div id="resultID"
         class="resultID">
    </div>

    <div id="resultTime"
         class="resultTime">
    </div>

    <div id="resultMessage"
         class="resultMessage">
    </div>

    <div id="readyMessage"
         class="readyMessage">
      Preparing scanner...
    </div>

  </div>

</div>


<script>


/* =====================================================
   SETTINGS
   ===================================================== */

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbw0BP2N9sXe-4GqYvAwl6YlNXv_7POvqxkQ1GUmIO1tJL09v3m44bpqzm8BArjyApH9/exec';


/* =====================================================
   VARIABLES
   ===================================================== */

let scanner = null;

let alreadyScanned = false;

let startingCamera = false;

let callbackCounter = 0;


/* =====================================================
   ELEMENTS
   ===================================================== */

const statusElement =
  document.getElementById("status");

const detectedElement =
  document.getElementById("detected");

const cameraSelect =
  document.getElementById("cameraSelect");

const resultBox =
  document.getElementById("resultBox");

const resultTitle =
  document.getElementById("resultTitle");

const resultEmployee =
  document.getElementById("resultEmployee");

const resultID =
  document.getElementById("resultID");

const resultTime =
  document.getElementById("resultTime");

const resultMessage =
  document.getElementById("resultMessage");

const readyMessage =
  document.getElementById("readyMessage");


/* =====================================================
   STATUS
   ===================================================== */

function showStatus(
  message,
  type
) {

  if (type === "error") {

    statusElement.innerHTML =
      "<span class='error'>" +
      message +
      "</span>";

  }

  else if (type === "success") {

    statusElement.innerHTML =
      "<span class='success'>" +
      message +
      "</span>";

  }

  else if (type === "warning") {

    statusElement.innerHTML =
      "<span class='warning'>" +
      message +
      "</span>";

  }

  else {

    statusElement.innerText =
      message;

  }

}


/* =====================================================
   GET CAMERAS WITH RETRY
   ===================================================== */

async function getCamerasWithRetry(
  attempts = 5
) {

  let lastError =
    null;


  for (
    let i = 0;
    i < attempts;
    i++
  ) {

    try {

      console.log(
        "Requesting cameras. Attempt:",
        i + 1
      );


      const cameras =
        await Html5Qrcode.getCameras();


      if (
        cameras &&
        cameras.length > 0
      ) {

        return cameras;

      }

    }

    catch (error) {

      lastError =
        error;

      console.log(
        "Camera request failed.",
        error
      );

    }


    /*
     * Wait before retrying.
     */

    await new Promise(
      function(resolve) {

        setTimeout(
          resolve,
          1000
        );

      }
    );

  }


  throw lastError ||
    new Error(
      "No camera detected."
    );

}


/* =====================================================
   SELECT BEST CAMERA
   ===================================================== */

function selectBestCamera(
  cameras
) {

  /*
   * Prefer HP camera.
   */

  let selected =
    cameras.find(
      function(camera) {

        return (
          camera.label &&
          camera.label
            .toLowerCase()
            .includes("hp")
        );

      }
    );


  /*
   * Otherwise use first camera.
   */

  if (!selected) {

    selected =
      cameras[0];

  }


  return selected;

}


/* =====================================================
   INITIALIZE CAMERA
   ===================================================== */

async function initializeCamera() {

  if (startingCamera) {

    return;

  }


  startingCamera =
    true;

  alreadyScanned =
    false;


  detectedElement.style.display =
    "none";


  resultBox.style.display =
    "none";


  showStatus(
    "Starting camera...",
    "normal"
  );


  try {

    /*
     * Clean previous scanner.
     */

    await cleanupScanner();


    /*
     * Give Chrome time to release
     * the previous camera.
     */

    await wait(800);


    /*
     * Get cameras.
     */

    const cameras =
      await getCamerasWithRetry(5);


    /*
     * Fill camera dropdown.
     */

    cameraSelect.innerHTML =
      "";


    cameras.forEach(
      function(camera, index) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          camera.id;


        option.text =
          camera.label ||
          "Camera " +
          (index + 1);


        cameraSelect.appendChild(
          option
        );

      }
    );


    /*
     * Select best camera.
     */

    const selectedCamera =
      selectBestCamera(
        cameras
      );


    cameraSelect.value =
      selectedCamera.id;


    /*
     * Start scanner.
     */

    await startScanner(
      selectedCamera.id
    );


  }

  catch (error) {

    console.error(
      "Camera initialization error:",
      error
    );


    showStatus(
      "Camera is temporarily unavailable. Retrying...",
      "error"
    );


    startingCamera =
      false;


    /*
     * Retry automatically.
     */

    setTimeout(
      function() {

        initializeCamera();

      },
      2000
    );


    return;

  }


  startingCamera =
    false;

}


/* =====================================================
   WAIT
   ===================================================== */

function wait(
  milliseconds
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milliseconds
      );

    }
  );

}


/* =====================================================
   CLEANUP SCANNER
   ===================================================== */

async function cleanupScanner() {

  if (!scanner) {

    return;

  }


  try {

    await scanner.stop();

  }

  catch (error) {

    console.log(
      "Scanner stop skipped:",
      error
    );

  }


  try {

    scanner.clear();

  }

  catch (error) {

    console.log(
      "Scanner clear skipped:",
      error
    );

  }


  scanner =
    null;

}


/* =====================================================
   START SCANNER
   ===================================================== */

async function startScanner(
  cameraId
) {

  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 20,


    qrbox:
      function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const minSize =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          );


        return {

          width:
            Math.floor(
              minSize * 0.75
            ),

          height:
            Math.floor(
              minSize * 0.75
            )

        };

      },


    formatsToSupport: [

      Html5QrcodeSupportedFormats.QR_CODE

    ],


    disableFlip:
      false

  };


  await scanner.start(

    cameraId,

    config,


    /*
     * QR successfully detected.
     */

    async function(
      decodedText,
      decodedResult
    ) {

      if (alreadyScanned) {

        return;

      }


      alreadyScanned =
        true;


      console.log(
        "QR CODE FOUND:",
        decodedText
      );


      showStatus(
        "✓ QR CODE SUCCESSFULLY READ",
        "success"
      );


      detectedElement.style.display =
        "block";


      /*
       * Stop camera before sending
       * the QR to Apps Script.
       */

      await cleanupScanner();


      /*
       * Send QR to Apps Script
       * without leaving this page.
       */

      sendQRToAppsScript(
        decodedText
      );

    },


    /*
     * Normal QR scanning errors.
     */

    function(errorMessage) {

      /*
       * Ignore normal scanning errors.
       */

    }

  );


  showStatus(
    "Camera ready — place the QR code inside the box.",
    "normal"
  );

}


/* =====================================================
   SEND QR TO APPS SCRIPT
   ===================================================== */

function sendQRToAppsScript(
  qrValue
) {

  /*
   * Create a unique JSONP callback.
   */

  callbackCounter++;


  const callbackName =
    "opecAttendanceCallback" +
    Date.now() +
    "_" +
    callbackCounter;


  /*
   * Create callback function.
   */

  window[callbackName] =
    function(result) {

      console.log(
        "Attendance result:",
        result
      );


      /*
       * Remove callback.
       */

      try {

        delete window[
          callbackName
        ];

      }

      catch (error) {

        window[
          callbackName
        ] = undefined;

      }


      /*
       * Remove script tag.
       */

      const script =
        document.getElementById(
          callbackName
        );


      if (script) {

        script.remove();

      }


      /*
       * Display result.
       */

      displayResult(
        result
      );

    };


  /*
   * Build Apps Script URL.
   */

  const destination =
    APPS_SCRIPT_URL +
    "?qr=" +
    encodeURIComponent(
      qrValue
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  console.log(
    "Sending QR to Apps Script."
  );


  /*
   * Create script tag.
   *
   * This allows cross-domain JSONP.
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    destination;


  script.async =
    true;


  /*
   * Error handling.
   */

  script.onerror =
    function() {

      console.error(
        "Unable to contact Apps Script."
      );


      try {

        delete window[
          callbackName
        ];

      }

      catch (error) {

        window[
          callbackName
        ] = undefined;

      }


      script.remove();


      displayResult({

        success: false,

        type: "error",

        message:
          "Unable to connect to the attendance system."

      });

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   DISPLAY ATTENDANCE RESULT
   ===================================================== */

function displayResult(
  result
) {

  /*
   * Hide scanner temporarily.
   */

  document.getElementById(
    "reader"
  ).style.display =
    "none";


  cameraSelect.style.display =
    "none";


  detectedElement.style.display =
    "none";


  resultBox.style.display =
    "block";


  /*
   * Clear old classes.
   */

  resultBox.className =
    "resultBox";


  /*
   * SUCCESS
   */

  if (
    result &&
    result.success
  ) {

    resultBox.classList.add(
      "resultSuccess"
    );


    if (
      result.action ===
      "TIME IN"
    ) {

      resultTitle.innerText =
        "✓ TIME IN";

    }

    else {

      resultTitle.innerText =
        "✓ TIME OUT";

    }


    resultEmployee.innerText =
      result.employeeName ||
      "";


    resultID.innerText =
      result.employeeID ||
      "";


    resultTime.innerText =
      result.time ||
      "";


    resultMessage.innerText =
      getGreeting();


    readyMessage.innerText =
      "Ready for next employee...";


    showStatus(
      "Attendance recorded successfully.",
      "success"
    );

  }


  /*
   * DUPLICATE
   */

  else if (
    result &&
    result.type ===
      "duplicate"
  ) {

    resultBox.classList.add(
      "resultWarning"
    );


    resultTitle.innerText =
      "⚠ ALREADY RECORDED";


    resultEmployee.innerText =
      result.employeeName ||
      "";


    resultID.innerText =
      result.employeeID ||
      "";


    resultTime.innerText =
      result.time ||
      "";


    resultMessage.innerText =
      result.message ||
      "This attendance was already recorded.";


    readyMessage.innerText =
      "Returning to scanner...";


  }


  /*
   * COMPLETE
   */

  else if (
    result &&
    result.type ===
      "complete"
  ) {

    resultBox.classList.add(
      "resultWarning"
    );


    resultTitle.innerText =
      "✓ ATTENDANCE COMPLETE";


    resultEmployee.innerText =
      result.employeeName ||
      "";


    resultID.innerText =
      result.employeeID ||
      "";


    resultTime.innerText =
      result.time ||
      "";


    resultMessage.innerText =
      result.message ||
      "Attendance already completed for today.";


    readyMessage.innerText =
      "Returning to scanner...";

  }


  /*
   * INVALID / ERROR
   */

  else {

    resultBox.classList.add(
      "resultError"
    );


    resultTitle.innerText =
      "✕ ERROR";


    resultEmployee.innerText =
      "";


    resultID.innerText =
      "";


    resultTime.innerText =
      "";


    resultMessage.innerText =
      (
        result &&
        result.message
      ) ||
      "Unable to process QR code.";


    readyMessage.innerText =
      "Returning to scanner...";

  }


  /*
   * Restart scanner after
   * displaying result.
   */

  setTimeout(
    async function() {

      resultBox.style.display =
        "none";


      document.getElementById(
        "reader"
      ).style.display =
        "block";


      cameraSelect.style.display =
        "inline-block";


      showStatus(
        "Starting camera...",
        "normal"
      );


      await wait(500);


      initializeCamera();

    },
    3000
  );

}


/* =====================================================
   GREETING
   ===================================================== */

function getGreeting() {

  const hour =
    new Date().getHours();


  if (hour < 12) {

    return "Good morning!";

  }


  if (hour < 18) {

    return "Good afternoon!";

  }


  return "Good evening!";

}


/* =====================================================
   CAMERA SELECTION
   ===================================================== */

cameraSelect.addEventListener(
  "change",
  async function() {

    if (startingCamera) {

      return;

    }


    if (!cameraSelect.value) {

      return;

    }


    startingCamera =
      true;


    try {

      alreadyScanned =
        false;


      await cleanupScanner();


      await wait(500);


      await startScanner(
        cameraSelect.value
      );

    }

    catch (error) {

      console.error(
        "Camera selection error:",
        error
      );


      showStatus(
        "Unable to start selected camera.",
        "error"
      );

    }


    startingCamera =
      false;

  }
);


/* =====================================================
   START APPLICATION
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    initializeCamera();

  }
);

</script>

</body>

</html>
