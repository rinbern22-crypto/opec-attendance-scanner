<script>

/* =====================================================
   SETTINGS
   ===================================================== */

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbxvi8ohV2MzVZY2GWJMveirCREAhDuqyWthqFQ0LbrQo9Cx-h9nursObxBb9GkmQIgy/exec';


/* =====================================================
   VARIABLES
   ===================================================== */

let scanner = null;
let alreadyScanned = false;
let startingCamera = false;


/* =====================================================
   ELEMENTS
   ===================================================== */

const statusElement =
  document.getElementById("status");

const detectedElement =
  document.getElementById("detected");

const cameraSelect =
  document.getElementById("cameraSelect");


/* =====================================================
   STATUS
   ===================================================== */

function showStatus(message, type) {

  if (type === "error") {

    statusElement.innerHTML =
      "<span class='error'>" +
      message +
      "</span>";

  }

  else if (type === "success") {

    statusElement.innerHTML =
      "<span class='success'>" +
      message +
      "</span>";

  }

  else {

    statusElement.innerText = message;

  }

}


/* =====================================================
   GET CAMERAS WITH RETRY
   ===================================================== */

async function getCamerasWithRetry(attempts = 5) {

  let lastError = null;

  for (let i = 0; i < attempts; i++) {

    try {

      console.log(
        "Requesting cameras. Attempt:",
        i + 1
      );

      const cameras =
        await Html5Qrcode.getCameras();

      if (cameras && cameras.length > 0) {

        console.log(
          "Cameras found:",
          cameras
        );

        return cameras;

      }

    }

    catch (error) {

      lastError = error;

      console.log(
        "Camera request failed. Retrying...",
        error
      );

    }

    /*
     * Give Chrome time to release
     * the previous camera session.
     */

    await new Promise(function(resolve) {

      setTimeout(resolve, 1000);

    });

  }

  throw lastError ||
    new Error("No camera detected.");

}


/* =====================================================
   INITIALIZE CAMERA
   ===================================================== */

async function initializeCamera() {

  if (startingCamera) {

    return;

  }

  startingCamera = true;
  alreadyScanned = false;

  detectedElement.style.display = "none";

  showStatus(
    "Starting camera...",
    "normal"
  );

  try {

    /*
     * Make sure any previous scanner
     * has been completely cleaned up.
     */

    if (scanner) {

      try {

        await scanner.stop();

      }

      catch (error) {

        console.log(
          "Previous scanner already stopped."
        );

      }

      try {

        scanner.clear();

      }

      catch (error) {

        console.log(
          "Scanner clear skipped."
        );

      }

      scanner = null;

    }


    /*
     * Small delay to allow Chrome
     * to release the previous camera.
     */

    await new Promise(function(resolve) {

      setTimeout(resolve, 800);

    });


    /*
     * Get available cameras.
     */

    const cameras =
      await getCamerasWithRetry(5);


    /*
     * Clear camera dropdown.
     */

    cameraSelect.innerHTML = "";


    /*
     * Add cameras to dropdown.
     */

    cameras.forEach(function(camera, index) {

      const option =
        document.createElement("option");

      option.value =
        camera.id;

      option.text =
        camera.label ||
        "Camera " + (index + 1);

      cameraSelect.appendChild(option);

    });


    /*
     * Prefer HP True Vision camera.
     */

    let selectedCamera =
      cameras.find(function(camera) {

        return (
          camera.label &&
          camera.label
            .toLowerCase()
            .includes("hp")
        );

      });


    /*
     * Otherwise use first camera.
     */

    if (!selectedCamera) {

      selectedCamera =
        cameras[0];

    }


    /*
     * Select camera in dropdown.
     */

    cameraSelect.value =
      selectedCamera.id;


    /*
     * Start QR scanner.
     */

    await startScanner(
      selectedCamera.id
    );


  }

  catch (error) {

    console.error(
      "Camera initialization error:",
      error
    );

    showStatus(
      "Camera is temporarily unavailable. Retrying...",
      "error"
    );


    /*
     * Automatically retry.
     */

    setTimeout(function() {

      startingCamera = false;

      initializeCamera();

    }, 2000);

    return;

  }

  startingCamera = false;

}


/* =====================================================
   START SCANNER
   ===================================================== */

async function startScanner(cameraId) {

  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 20,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      const minSize =
        Math.min(
          viewfinderWidth,
          viewfinderHeight
        );

      return {

        width:
          Math.floor(
            minSize * 0.75
          ),

        height:
          Math.floor(
            minSize * 0.75
          )

      };

    },

    formatsToSupport: [

      Html5QrcodeSupportedFormats.QR_CODE

    ],

    disableFlip: false

  };


  /*
   * Start camera.
   */

  await scanner.start(

    cameraId,

    config,


    /*
     * QR successfully detected.
     */

    async function(decodedText, decodedResult) {

      if (alreadyScanned) {

        return;

      }

      alreadyScanned = true;


      console.log(
        "QR CODE FOUND:",
        decodedText
      );


      showStatus(
        "✓ QR CODE SUCCESSFULLY READ",
        "success"
      );


      detectedElement.style.display =
        "block";


      /*
       * STOP CAMERA BEFORE LEAVING PAGE
       */

      try {

        await scanner.stop();

        console.log(
          "Camera stopped successfully."
        );

      }

      catch (error) {

        console.log(
          "Camera stop error:",
          error
        );

      }


      /*
       * CLEAR SCANNER
       */

      try {

        scanner.clear();

      }

      catch (error) {

        console.log(
          "Scanner clear error:",
          error
        );

      }


      scanner = null;


      /*
       * Give Chrome a moment to release
       * the camera completely.
       */

      await new Promise(function(resolve) {

        setTimeout(resolve, 500);

      });


      /*
       * Send QR to Apps Script.
       */

      const destination =

        APPS_SCRIPT_URL +

        '?qr=' +

        encodeURIComponent(
          decodedText
        );


      console.log(
        "Sending QR to Apps Script:",
        destination
      );


      window.location.href =
        destination;

    },


    /*
     * Normal scanning errors.
     */

    function(errorMessage) {

      /*
       * Ignore normal QR scanning errors.
       */

    }

  );


  showStatus(
    "Camera ready — place the QR code inside the box.",
    "normal"
  );

}


/* =====================================================
   CAMERA SELECTION CHANGE
   ===================================================== */

cameraSelect.addEventListener(
  "change",
  async function() {

    if (startingCamera) {

      return;

    }

    if (!cameraSelect.value) {

      return;

    }

    startingCamera = true;

    try {

      if (scanner) {

        try {

          await scanner.stop();

        }

        catch (error) {

          console.log(
            "Scanner stop skipped."
          );

        }

        try {

          scanner.clear();

        }

        catch (error) {

          console.log(
            "Scanner clear skipped."
          );

        }

        scanner = null;

      }


      await new Promise(function(resolve) {

        setTimeout(resolve, 500);

      });


      alreadyScanned = false;

      await startScanner(
        cameraSelect.value
      );

    }

    catch (error) {

      console.error(
        "Camera selection error:",
        error
      );

      showStatus(
        "Unable to start selected camera.",
        "error"
      );

    }

    startingCamera = false;

  }
);


/* =====================================================
   START
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    initializeCamera();

  }
);

</script>
